[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "JohnnySimple",email = "obengboatengjohnson@gmail.com"}
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "pymupdf (>=1.26.4,<2.0.0)",
    "uvicorn (>=0.38.0,<0.39.0)",
    "fastapi (>=0.119.0,<0.120.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "pydantic-settings (>=2.11.0,<3.0.0)",
    "spacy (>=3.8.7,<4.0.0)",
    "sqlalchemy (>=2.0.44,<3.0.0)",
    "sqlmodel (>=0.0.27,<0.0.28)",
    "pgvector (>=0.4.1,<0.5.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "greenlet (>=3.2.4,<4.0.0)",
    "psycopg2 (>=2.9.11,<3.0.0)",
    "alembic (>=1.17.0,<2.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "tiktoken (>=0.12.0,<0.13.0)",
    "filelock (>=3.20.0,<4.0.0)",
    "sentence-transformers (>=5.1.2,<6.0.0)",
    "pretrainedmodels (>=0.7.4,<0.8.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "passlib (>=1.7.4,<2.0.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0"
pytest-asyncio = ">=1.0"
ruff = ">=0.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs Postgres with pgvector at TEST_DATABASE_URL (skipped when unset)",
]

[tool.ruff]
line-length = 120
extend-exclude = ["alembic/versions", "venv"]

[tool.ruff.lint]
# Pinned so results don't depend on a developer's global ruff config.
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
