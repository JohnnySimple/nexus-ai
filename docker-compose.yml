services:
  backend:
    container_name: nexus-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    # Secrets and connection strings are injected at runtime; .dockerignore keeps .env out of the image.
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED="1"
    networks:
      - nexus-network
    # ensure Linux host can connect to host services
    # extra-hosts:
    #   - "host.docker.internal:host-gateway"
    restart: unless-stopped
    command: >
      python -m uvicorn src.main:app
      --host 0.0.0.0
      --reload
    # volumes:
    #   - .:/app

  frontend:
    container_name: nexus-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5001:5001"
    networks:
      - nexus-network
    restart: unless-stopped
    env_file:
      - ./frontend/.env

networks:
  nexus-network:
    driver: bridge